[project]
name = "support-ai"
version = "0.1.0"
description = "AI-powered customer support backend built with FastAPI, PostgreSQL, SQLAlchemy, and Groq."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]
